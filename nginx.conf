upstream django {
    server 127.0.0.1:8000;  # Gunicorn
}

server {
    listen 80;
    server_name localhost;  # Замените на ваш домен в production

    # Максимальный размер загружаемых файлов
    client_max_body_size 10M;

    # Логи
    access_log /var/log/nginx/library_access.log;
    error_log /var/log/nginx/library_error.log;

    # Статические файлы
    location /static/ {
        alias /path/to/your/staticfiles/;  # Замените на реальный путь
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Медиа файлы
    location /media/ {
        alias /path/to/your/mediafiles/;  # Замените на реальный путь
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Проксирование запросов к Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
} 