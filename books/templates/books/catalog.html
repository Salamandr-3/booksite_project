
{% extends 'books/base.html' %}
{% load static %}

{% block title %}Каталог{% endblock %}

{% block content %}
<div class="book-grid">
    {% for book in books %}
    <div class="book-card">
        <img src="{% static book.static_image_path %}" alt="{{ book.title }}">
        <h3>{{ book.title }}</h3>
        <p>{{ book.description }}</p>
        <p class="author">{{ book.author }}</p>
        <p class="price">{{ book.price }} ₽</p>
        <a href="{% url 'book_detail' book.id %}" class="btn">Подробнее</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
