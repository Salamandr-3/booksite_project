
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МирКниг - {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'books/css/style.css' %}">
</head>
<body>
    <header class="header">
        <nav class="nav-menu">
            <div class="logo">
                <a href="{% url 'index' %}">
                    <span class="logo-text">Мир<span class="accent">Книг</span></span>
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="{% url 'catalog' %}" {% if request.path == '/catalog/' %}class="active"{% endif %}>Каталог</a></li>
                <li><a href="{% url 'about' %}" {% if request.path == '/about/' %}class="active"{% endif %}>О нас</a></li>
                <li><a href="{% url 'contacts' %}" {% if request.path == '/contacts/' %}class="active"{% endif %}>Контакты</a></li>
            </ul>
            <a href="{% url 'register' %}" class="button">Войти</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
